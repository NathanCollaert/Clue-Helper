name: Daily bake

# Re-bakes catalog.json, requirements.json and the gameval values in tables.tsv against the latest RuneLite
# release, and commits the result straight to dev when it changed and the tests still pass.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: bake

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - run: ./gradlew bakeData
      - id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          fi
      - if: steps.diff.outputs.changed == 'true'
        run: ./gradlew test
      - if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Re-bake data against the latest RuneLite release"
          git push origin HEAD:dev
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-changes
          path: build/campaign/changed.html
          if-no-files-found: ignore
