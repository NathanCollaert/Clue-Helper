name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - run: ./gradlew test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-changes
          path: build/campaign/changed.html
          if-no-files-found: ignore
