plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
	}
	mavenCentral()
}

def runeLiteVersion = project.findProperty('runeliteVersion') ?: 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.20'
	annotationProcessor 'org.projectlombok:lombok:1.18.20'

	testCompileOnly 'org.projectlombok:lombok:1.18.20'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.20'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.cluehelper'
version = '1.0-SNAPSHOT'
sourceCompatibility = '11'

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

test {
	maxHeapSize = '256m'
}

tasks.register('dev', JavaExec) {
	group = 'application'
	description = 'Launch a dev client with Clue Helper: gradlew dev [-Pselftest]'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.cluehelper.ClueHelperPluginTest'
	// RuneLite refuses to load a builtin plugin without assertions on.
	// Core's GPU plugin trips its own assert in ModelUploader.uploadSortedModel (1.13.2, seen drawing
	// the bank), which stops the client; assertions stay on everywhere else.
	jvmArgs '-ea', '-da:net.runelite.client.plugins.gpu...', '-Xmx1g'
	if (project.hasProperty('selftest')) {
		// ClueHelperDevPlugin runs ::ch-selftest a few ticks after the first login.
		systemProperty 'cluehelper.selftest', 'true'
	}
	// The ::ch-* commands and self-tests exist only in developer mode.
	args '--developer-mode'
}

tasks.register('coreClues', JavaExec) {
	group = 'tools'
	description = "Export core's clue data from the client jar to tools/cache/out/core-clues.json"
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.cluehelper.step.CoreClueExport'
	args 'tools/cache/out/core-clues.json'
}

tasks.register('planReplay', JavaExec) {
	group = 'tools'
	description = 'Plan the slow-plan recordings of the dev client again and print their times: gradlew planReplay [-Pplans=<folder>]'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.cluehelper.PlanReplay'
	args project.findProperty('plans') ?: 'build/plans'
}

tasks.register('spellbookTimings', JavaExec) {
	group = 'tools'
	description = 'Print the spellbook-change trials of one probe events.jsonl: gradlew spellbookTimings -Plog=<relative path>'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.cluehelper.dev.SpellbookTimingDump'
	args project.findProperty('log') ?: 'src/test/resources/b04/run1-swap-and-occult.jsonl'
}
